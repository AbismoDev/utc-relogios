<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="assets/css/style.css">

    <title>Relogio Universal</title>
</head>
<body>
    
    <main>
        <section>
            <div class="container">
                <div class="container--app">
                    <div class="container--texto">
                        <h1>Relogios Universais</h1>
                        <p>
                            Escolha o fuso horario que deseja ver a hora exata.
                        </p>
                    </div>
                    <div class="container--relogios">
                        <div class="relogio">
                            <h2>Horário de Brasília</h2>
                            <span id="hora--relogio1">00:00:00</span>
                            <select name="" class="lista--fuso--horario">
                                <option value="" disabled selected>Selecione a cidade</option>
                            </select>
                        </div>
                        <div class="relogio">
                            <h2>Horário de São Paulo</h2>
                            <span id="hora--relogio2">00:00:00</span>
                            <select name="" class="lista--fuso--horario">
                                <option value="" disabled selected>Selecione a cidade</option>
                            </select>
                        </div>
                        <div class="relogio">
                            <h2>Horário de Rio de Janeiro</h2>
                            <span id="hora--relogio3">00:00:00</span>
                            <select name="" class="lista--fuso--horario">
                                <option value="" disabled selected>Selecione a cidade</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="assets/js/index.js"></script>
</body>
</html>
